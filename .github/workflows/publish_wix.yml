name: Wix 블로그 자동 발행

on:
  push:
    branches: [main]
    paths:
      - 'cso_news_data_W*.json'
  workflow_dispatch:
    inputs:
      json_file:
        description: '발행할 JSON 파일명 (예: cso_news_data_W44.json)'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Wix 블로그 발행
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
        run: |
          # 수동 트리거 시 입력값 우선, 없으면 커밋에서 찾기
          LATEST="${{ github.event.inputs.json_file }}"

          if [ -z "$LATEST" ]; then
            LATEST=$(git diff-tree --no-commit-id -r --name-only ${{ github.sha }} \
              | grep 'cso_news_data_W.*\.json' | head -1)
          fi

          if [ -z "$LATEST" ]; then
            LATEST=$(ls cso_news_data_W*.json 2>/dev/null | sort -V | tail -1)
          fi

          if [ -z "$LATEST" ]; then
            echo "발행할 JSON 파일이 없습니다."
            exit 0
          fi

          echo "발행 대상: $LATEST"
          python3 publish_wix_blog.py "$LATEST"
